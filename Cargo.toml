[workspace]
resolver = "2"
members = [
  "crates/strictly_games",
  "crates/strictly_tictactoe",
  "crates/strictly_blackjack",
  "crates/strictly_craps",
  "crates/strictly_proofs",
  "crates/strictly_server",
  "crates/strictly_verus",
]

[workspace.package]
edition = "2024"
authors = ["Erik Rose <erik.w.rose@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/crumplecup/strictly_games"

[workspace.dependencies]
# Core game logic
strictly_tictactoe = { path = "crates/strictly_tictactoe" }
strictly_blackjack = { path = "crates/strictly_blackjack" }
strictly_craps = { path = "crates/strictly_craps" }
strictly_server = { path = "crates/strictly_server" }

# Elicitation framework (local dev)
elicitation = { version = "0.11.1", features = ["rand"] }
elicitation_derive = { version = "0.11.1" }
elicitation_rand = { version = "0.11.1" }
elicit_ratatui = { version = "0.11.1", features = ["runtime"] }
elicit_egui = { version = "0.11.1" }
elicit_leptos = { version = "0.11.1" }
elicit_ui = { version = "0.11.1" }
elicit_accesskit = { version = "0.11.1" }
elicit_db = { version = "0.11.1" }
elicit_redb = { version = "0.11.1" }
accesskit = { version = "0.24", features = ["serde", "schemars"] }

# GUI (egui frontend)
egui = { version = "0.34", features = ["serde"] }
egui-winit = { version = "0.34" }
egui-wgpu = { version = "0.34", features = ["winit"] }
wgpu = { version = "29", default-features = false, features = [
  "metal",
  "vulkan",
  "dx12",
  "webgpu",
] }
winit = { version = "0.30", features = ["serde"] }
futures = "0.3"

# Verification
creusot-std = { version = "0.11.0" }
kani-verifier = { version = "0.67" }

# Database (uuid and chrono added for redb layer)
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
derive_more = { version = "2", features = ["display", "error", "from"] }
derive-getters = "0.5"
derive_setters = "0.1"
derive-new = "0.7"

# Web framework
axum = "0.8"
tower = "0.5"
hyper = "1"
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
reqwest = { version = "0.13.2", features = ["json"] }

# MCP
rmcp = { version = "1", features = [
  "server",
  "client",
  "transport-io",
  "transport-streamable-http-server",
  "transport-streamable-http-client",
  "transport-streamable-http-client-reqwest",
] }
schemars = { version = "1", features = ["derive"] }

# LLM clients
async-openai = { version = "0.40", features = ["chat-completion"] }

# Config
dotenvy = "0.15"
clap = { version = "4", features = ["derive"] }
toml = "1"

# Utilities
async-trait = "0.1"
strum = { version = "0.28", features = ["derive"] }
syn = { version = "2", features = ["full"] }
prettyplease = "0.2"
proc-macro2 = "1"

# TUI
ratatui = "0.30"
crossterm = "0.29"
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
