[package]
name = "strictly_verus"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Self-contained Verus verification targets for strictly_games VSMs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus)'] }

# No runtime dependencies — the generated .rs files are standalone Verus targets,
# never compiled as part of a regular Rust binary or library.
[dependencies]

[build-dependencies]
strictly_tictactoe = { workspace = true }
strictly_blackjack = { path = "../strictly_blackjack", default-features = false }
strictly_craps = { path = "../strictly_craps", default-features = false }
elicitation = { workspace = true }
proc-macro2 = { workspace = true }

[lib]
name = "strictly_verus"
path = "src/lib.rs"
